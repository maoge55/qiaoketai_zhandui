{% extends "base.html" %}
{% block title %}战队名册 - 敲可爱战队{% endblock %}

{% block content %}
<div class="qk-container">
  <h1>战队名册</h1>
  <p class="members-subtitle">
    按照 <strong>影响力</strong> 与 <strong>当前赛季表现</strong> 排序，影响力越高、名次越靠前的成员会排在前面。
  </p>

  <div class="qk-grid members-grid" id="members-grid">
    <!-- 成员卡片将由 JS 动态插入 -->
  </div>

  <div id="members-loading" class="members-loading" style="display:none;">
    正在加载成员...
  </div>
  <div id="members-empty" class="members-empty" style="display:none;">
    暂时没有成员。
  </div>

  <!-- 分页控件 -->
  <div class="members-pagination" id="members-pagination" style="display:none;">
    <button class="pagination-btn" id="members-prev">上一页</button>
    <div class="pagination-numbers" id="members-page-numbers">
      <!-- 页码按钮由 JS 动态生成 -->
    </div>
    <button class="pagination-btn" id="members-next">下一页</button>
    <span class="pagination-info" id="members-page-info">第 1 / 1 页</span>
    <div class="pagination-jump">
      <input type="number" id="members-jump-input" min="1" placeholder="页码" />
      <button class="pagination-btn" id="members-jump-btn">跳转</button>
    </div>
  </div>
</div>
{% endblock %}
