{% extends "base.html" %}
{% block title %}地下竞技场国服榜 - 敲可爱战队{% endblock %}
{% block content %}
<div class="qk-container ua-rank-page">
  <div class="ua-rank-header">
    <h1>地下竞技场国服榜单</h1>
    <div class="ua-rank-stats" id="ua-rank-stats" style="display:none;">
      <div class="ua-rank-stat">
        <span class="label">当前赛季</span>
        <span class="value" id="season-id">-</span>
      </div>
      <div class="ua-rank-stat">
        <span class="label">战队上榜</span>
        <span class="value"><span id="member-count">0</span> 人</span>
      </div>
      <div class="ua-rank-stat update-timer">
        <span class="label">下次更新</span>
        <span class="value" id="update-countdown">--:--</span>
      </div>
    </div>
    
    <!-- 管理员专属按钮 -->
    {% if current_user and current_user.role.value in ['admin', 'super_admin'] %}
    <div class="ua-rank-admin">
      <button id="btn-sync-all-seasons" class="btn-sync">
        🔄 同步所有历史赛季成绩
      </button>
    </div>
    <div id="sync-all-status" class="sync-progress" style="display:none;"></div>
    {% endif %}
  </div>

  <!-- 加载状态 -->
  <div id="ua-rank-loading" class="ua-rank-loading">
    <div class="spinner"></div>
    <div class="text">正在获取赛季数据...</div>
  </div>

  <!-- 错误提示 -->
  <div id="ua-rank-error" class="ua-rank-empty" style="display:none;">
    <div class="icon">⚠️</div>
    <div class="text" id="error-text">获取数据失败</div>
  </div>

  <!-- 数据表格 -->
  <div id="ua-rank-content" class="ua-rank-table-wrap" style="display:none;">
    <table class="ua-rank-table">
      <thead>
        <tr>
          <th class="ua-rank-col">排名</th>
          <th>战队成员</th>
          <th>积分</th>
        </tr>
      </thead>
      <tbody id="ua-rank-tbody">
        <!-- 数据由 JS 动态填充 -->
      </tbody>
    </table>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const loadingEl = document.getElementById("ua-rank-loading");
  const errorEl = document.getElementById("ua-rank-error");
  const contentEl = document.getElementById("ua-rank-content");
  const statsEl = document.getElementById("ua-rank-stats");
  const seasonIdEl = document.getElementById("season-id");
  const memberCountEl = document.getElementById("member-count");
  const tbodyEl = document.getElementById("ua-rank-tbody");
  const syncAllBtn = document.getElementById("btn-sync-all-seasons");
  const syncAllStatus = document.getElementById("sync-all-status");
  const errorTextEl = document.getElementById("error-text");
  const countdownEl = document.getElementById("update-countdown");

  let secondsUntilUpdate = 0;
  let countdownTimer = null;

  // 格式化倒计时
  function formatCountdown(seconds) {
    if (seconds <= 0) return "即将更新...";
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins}:${secs.toString().padStart(2, '0')}`;
  }

  // 启动倒计时
  function startCountdown(seconds) {
    secondsUntilUpdate = seconds;
    countdownEl.textContent = formatCountdown(secondsUntilUpdate);
    
    if (countdownTimer) clearInterval(countdownTimer);
    
    countdownTimer = setInterval(() => {
      secondsUntilUpdate--;
      countdownEl.textContent = formatCountdown(secondsUntilUpdate);
      
      if (secondsUntilUpdate <= 0) {
        clearInterval(countdownTimer);
        // 倒计时结束，自动刷新数据
        setTimeout(() => {
          location.reload();
        }, 1000);
      }
    }, 1000);
  }

  // 获取排行榜数据
  try {
    const res = await fetch("/api/ua-rank/current-season");
    const data = await res.json();

    if (data.error) {
      loadingEl.style.display = "none";
      errorEl.style.display = "flex";
      errorTextEl.textContent = data.message || "获取数据失败";
      return;
    }

    // 显示数据
    loadingEl.style.display = "none";
    contentEl.style.display = "block";
    statsEl.style.display = "flex";
    seasonIdEl.textContent = data.season_id;
    memberCountEl.textContent = data.total;

    // 启动倒计时
    if (data.seconds_until_update !== undefined) {
      startCountdown(data.seconds_until_update);
    }

    // 渲染表格
    const members = data.members || [];
    if (members.length === 0) {
      tbodyEl.innerHTML = '<tr><td colspan="3" style="text-align:center;padding:40px;color:#6b7280;">暂无战队成员上榜</td></tr>';
    } else {
      tbodyEl.innerHTML = members.map((m) => {
        const rankClass = m.position <= 3 ? `rank-${m.position}` : "rank-normal";
        const avatarClass = m.position <= 3 ? "avatar rank-top3" : "avatar";
        const avatarStyle = m.avatar_url 
          ? `background-image:url('${m.avatar_url}')` 
          : "";
        const scoreClass = m.position === 1 ? "score-cell top-score" : "score-cell";
        return `
          <tr>
            <td class="ua-rank-col">
              <span class="rank-badge ${rankClass}">${m.position}</span>
            </td>
            <td>
              <div class="member-cell">
                <a href="/members/${m.user_id}">
                  <div class="${avatarClass}" style="${avatarStyle}"></div>
                </a>
                <div class="info">
                  <a href="/members/${m.user_id}" class="nickname">${escapeHtml(m.battle_tag)}</a>
                  ${m.nickname && m.nickname !== m.battle_tag ? `<span class="battle-tag">${escapeHtml(m.nickname)}</span>` : ""}
                </div>
              </div>
            </td>
            <td class="${scoreClass}">${m.score}</td>
          </tr>
        `;
      }).join("");
    }

  } catch (err) {
    console.error(err);
    loadingEl.style.display = "none";
    errorEl.style.display = "flex";
    errorTextEl.textContent = "网络错误，请稍后重试";
  }

  // ========== 暴雪API配置 ==========
  const BLIZZARD_MODE_API = "https://webapi.blizzard.cn/hs-rank-api-server/api/v2/game/mode";
  const BLIZZARD_RANKS_API = "https://webapi.blizzard.cn/hs-rank-api-server/api/game/ranks";

  // 获取当前赛季ID
  async function fetchCurrentSeasonId() {
    const resp = await fetch(BLIZZARD_MODE_API);
    const data = await resp.json();
    return data.data.season_map.undergroundarena[0].season_id;
  }

  // 获取单页排名
  async function fetchRanksPage(seasonId, page, maxRetries = 3) {
    for (let attempt = 0; attempt < maxRetries; attempt++) {
      try {
        const resp = await fetch(`${BLIZZARD_RANKS_API}?page=${page}&page_size=25&mode_name=undergroundarena&season_id=${seasonId}`);
        const data = await resp.json();
        return data?.data?.list || [];
      } catch (e) {
        if (attempt < maxRetries - 1) {
          await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
          continue;
        }
        throw e;
      }
    }
    return [];
  }

  // 获取赛季所有排名（最多20页）
  async function fetchAllRanks(seasonId, maxPages = 20) {
    const allRanks = [];
    for (let page = 1; page <= maxPages; page++) {
      try {
        const pageData = await fetchRanksPage(seasonId, page);
        if (!pageData || pageData.length === 0) break;
        allRanks.push(...pageData);
      } catch (e) {
        console.error(`获取赛季${seasonId}第${page}页失败:`, e);
        break;
      }
    }
    return allRanks;
  }

  // 管理员同步所有赛季（客户端请求暴雪API，服务端入库）
  if (syncAllBtn) {
    syncAllBtn.addEventListener("click", async () => {
      if (!confirm("确定要同步所有历史赛季成绩吗？这可能需要几分钟时间。\n\n数据将从您的浏览器直接请求暴雪API获取。")) return;
      
      syncAllBtn.disabled = true;
      syncAllBtn.classList.add("syncing");
      syncAllBtn.innerHTML = "⏳ 同步中...";
      syncAllStatus.style.display = "block";
      
      const startTime = Date.now();
      let totalSynced = 0;
      let syncedSeasons = 0;
      let failedSeasons = [];

      try {
        // 1. 获取当前赛季ID
        syncAllStatus.textContent = "正在获取赛季信息...";
        let currentSeasonId;
        for (let attempt = 0; attempt < 5; attempt++) {
          try {
            currentSeasonId = await fetchCurrentSeasonId();
            break;
          } catch (e) {
            if (attempt < 4) {
              await new Promise(r => setTimeout(r, 2000 * (attempt + 1)));
              continue;
            }
            throw new Error("获取赛季ID失败");
          }
        }
        
        syncAllStatus.textContent = `当前赛季: ${currentSeasonId}，开始同步...`;

        // 2. 遍历所有赛季
        for (let seasonId = 1; seasonId <= currentSeasonId; seasonId++) {
          syncAllStatus.textContent = `正在同步赛季 ${seasonId}/${currentSeasonId}...`;
          
          try {
            // 客户端请求暴雪API
            const ranks = await fetchAllRanks(seasonId);
            
            if (ranks.length === 0) continue;
            
            // 把数据提交给服务端入库
            const resp = await fetch("/api/ua-rank/sync-season-client", {
              method: "POST",
              credentials: "include",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ season_id: seasonId, ranks: ranks }),
            });
            
            const result = await resp.json();
            if (result.success && result.synced_count > 0) {
              totalSynced += result.synced_count;
              syncedSeasons++;
            }
          } catch (e) {
            console.error(`同步赛季${seasonId}失败:`, e);
            failedSeasons.push(seasonId);
          }
        }

        // 3. 完成
        const duration = ((Date.now() - startTime) / 1000).toFixed(1);
        let durationStr = duration >= 60 
          ? `${Math.floor(duration / 60)}分${Math.round(duration % 60)}秒`
          : `${duration}秒`;
        
        let msg = `✅ 同步完成！共同步 ${totalSynced} 条记录，涉及 ${syncedSeasons} 个赛季，耗时 ${durationStr}`;
        if (failedSeasons.length > 0) {
          msg += `（${failedSeasons.length} 个赛季失败）`;
        }
        syncAllStatus.textContent = msg;
        syncAllBtn.innerHTML = "✅ 同步完成";
        
      } catch (err) {
        console.error(err);
        syncAllStatus.textContent = `❌ 同步失败: ${err.message || "未知错误"}`;
        syncAllBtn.innerHTML = "❌ 同步失败";
      } finally {
        setTimeout(() => {
          syncAllBtn.disabled = false;
          syncAllBtn.classList.remove("syncing");
          syncAllBtn.innerHTML = "🔄 同步所有历史赛季成绩";
        }, 3000);
      }
    });
  }

  function escapeHtml(str) {
    return String(str ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
});
</script>
{% endblock %}
