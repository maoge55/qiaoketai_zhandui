{% extends "base.html" %}
{% block title %}卡牌评测 - 敲可爱战队{% endblock %}
{% block content %}
<div class="qk-container cards-page">
  <h1 class="page-title">卡牌评测</h1>

  <div class="cards-toolbar">
    <div class="cards-toolbar-left">
      <label class="cards-label">选择版本：</label>
      <div class="select-wrapper">
        <select id="expansion-select" class="cards-select"></select>
      </div>

      <label class="cards-label">职业：</label>
      <div class="select-wrapper">
        <select id="class-filter" class="cards-select">
          <option value="">全部职业</option>
          <option value="德鲁伊">德鲁伊</option>
          <option value="猎人">猎人</option>
          <option value="法师">法师</option>
          <option value="圣骑士">圣骑士</option>
          <option value="牧师">牧师</option>
          <option value="潜行者">潜行者</option>
          <option value="萨满">萨满</option>
          <option value="术士">术士</option>
          <option value="战士">战士</option>
          <option value="死亡骑士">死亡骑士</option>
          <option value="恶魔猎手">恶魔猎手</option>
          <option value="中立">中立</option>
        </select>
      </div>

      <label class="cards-label">稀有度：</label>
      <div class="select-wrapper">
        <select id="rarity-filter" class="cards-select">
          <option value="">全部稀有度</option>
          <option value="免费">免费</option>
          <option value="普通">普通</option>
          <option value="稀有">稀有</option>
          <option value="史诗">史诗</option>
          <option value="传说">传说</option>
        </select>
      </div>

      <label class="cards-label">排序：</label>
      <div class="select-wrapper">
        <select id="cards-sort-by" class="cards-select">
          <option value="hot">热门</option>
          <option value="class">按职业</option>
          <option value="win">按胜率</option>
          <option value="mana">按水晶</option>
          <option value="score" selected>按评分</option>
        </select>
      </div>
      <button id="cards-sort-order" type="button" class="btn-secondary cards-sort-order" data-order="desc">
        <span class="order-text">倒序</span>
        <span class="order-arrow" aria-hidden="true">&darr;</span>
      </button>
    </div>

    <div class="cards-toolbar-right">
      <div class="btn-group" style="margin-right: 12px;">
        <button id="btn-filter-arena" class="qk-btn qk-btn-outline qk-btn-sm" title="只显示竞技场卡池卡牌">🏟️ 竞技场</button>
        <button id="btn-filter-reviewed" class="qk-btn qk-btn-outline qk-btn-sm" title="只看我点评过的卡牌">我点评过的</button>
        <button id="btn-filter-unreviewed" class="qk-btn qk-btn-outline qk-btn-sm" title="只看我未点评的卡牌">我未点评的</button>
      </div>
      <input
        id="card-search"
        type="text"
        class="cards-search-input"
        placeholder="搜索卡牌名称..."
      />
    </div>
  </div>
  
  <div style="text-align: center; margin-bottom: 12px; color: #fbbf24; font-size: 13px; font-weight: 500;">
    <span style="display:inline-block; background:rgba(251, 191, 36, 0.1); padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(251, 191, 36, 0.3);">
      ✨ 小贴士：每点评一张卡牌，影响力 +1 哦！
    </span>
  </div>

  <div id="cards-grid" class="qk-grid cards-grid"></div>

  <!-- 分页控件 -->
  <div class="cards-pagination" id="cards-pagination" style="display:none;">
    <button class="pagination-btn" id="cards-prev">上一页</button>
    <div class="pagination-numbers" id="cards-page-numbers">
      <!-- 页码按钮由 JS 动态生成 -->
    </div>
    <button class="pagination-btn" id="cards-next">下一页</button>
    <span class="pagination-info" id="cards-page-info">第 1 / 1 页</span>
    <div class="pagination-jump">
      <input type="number" id="cards-jump-input" min="1" placeholder="页码" />
      <button class="pagination-btn" id="cards-jump-btn">跳转</button>
    </div>
  </div>
</div>
{% endblock %}
