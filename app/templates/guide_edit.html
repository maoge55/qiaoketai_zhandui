{% extends "base.html" %}
{% block title %}编辑攻略 - 竞技场宝典{% endblock %}

{% block head_extra %}
  <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet" />
  <style>
    #g-toolbar {
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(15, 23, 42, 0.55);
    }
    #g-editor {
      min-height: 420px;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-top: 0;
      background: rgba(15, 23, 42, 0.35);
      color: #e5e7eb;
    }
    #g-editor img {
      max-width: 100%;
      height: auto;
    }
    .ql-snow .ql-toolbar button,
    .ql-snow .ql-toolbar .ql-picker-label {
      color: #e5e7eb;
    }
    .ql-container.ql-snow {
      border: 0;
    }
    .ql-editor {
      padding: 14px 16px;
      font-size: 15px;
      line-height: 1.75;
    }
    .ql-editor a { color: #38bdf8; }
    .ql-editor img { max-width: 100%; height: auto; border-radius: 8px; }
  </style>
{% endblock %}

{% block content %}
<div class="qk-container">
  <div class="card">
    <h1>编辑攻略</h1>
    <p class="meta">管理员编辑模式</p>

    <form id="guide-edit-form" style="display:grid; gap: 14px; margin-top: 16px;">
      <label class="qk-field">
        <span class="qk-label">标题</span>
        <input id="g-title" class="qk-input" value="{{ article.title }}" required />
      </label>

      <div class="guide-meta-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap: 14px;">
        <label class="qk-field">
          <span class="qk-label">分类（可选）</span>
          <input id="g-category" class="qk-input" value="{{ article.category or '' }}" />
        </label>

        <label class="qk-field">
          <span class="qk-label">标签（可选，逗号分隔）</span>
          <input id="g-tags" class="qk-input" value="{% for t in article.tags %}{{ t.tag_name }}{% if not loop.last %}, {% endif %}{% endfor %}" />
        </label>
      </div>

      <label class="qk-field" style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="g-featured" {% if article.is_featured %}checked{% endif %} />
        <span class="qk-label" style="margin:0;">设为首页精选</span>
      </label>

      <div class="qk-field">
        <span class="qk-label">正文</span>

        <div id="g-toolbar">
          <span class="ql-formats">
            <select class="ql-header">
              <option selected></option>
              <option value="1">H1</option>
              <option value="2">H2</option>
              <option value="3">H3</option>
            </select>
          </span>
          <span class="ql-formats">
            <button class="ql-bold"></button>
            <button class="ql-italic"></button>
            <button class="ql-underline"></button>
            <button class="ql-strike"></button>
          </span>
          <span class="ql-formats">
            <button class="ql-blockquote"></button>
            <button class="ql-code-block"></button>
          </span>
          <span class="ql-formats">
            <button class="ql-list" value="ordered"></button>
            <button class="ql-list" value="bullet"></button>
          </span>
          <span class="ql-formats">
            <button class="ql-link"></button>
            <button class="ql-image"></button>
            <button class="ql-attachment" title="插入附件">📎</button>
          </span>
          <span class="ql-formats">
            <button class="ql-clean"></button>
          </span>
        </div>

        <div id="g-editor"></div>
        <textarea id="g-content" style="display:none;">{{ article.content }}</textarea>
      </div>

      <div style="display:flex; gap:10px; align-items:center;">
        <button type="submit" class="qk-btn qk-btn-primary">保存修改</button>
        <a href="/guides/{{ article.id }}" class="qk-btn qk-btn-outline">取消</a>
        <span id="g-status" class="meta"></span>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block body_extra %}
<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("guide-edit-form");
    if (!form) return;

    const articleId = {{ article.id }};
    const status = document.getElementById("g-status");
    const editorEl = document.getElementById("g-editor");
    const contentField = document.getElementById("g-content");

    async function uploadTo(url, file) {
      const token = getToken();
      if (!token) {
        window.location.href = "/login";
        return null;
      }

      const fd = new FormData();
      fd.append("file", file);

      const res = await fetch(url, {
        method: "POST",
        headers: { Authorization: "Bearer " + token },
        body: fd,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || "上传失败");
      return data.url;
    }

    const quill = new Quill(editorEl, {
      theme: "snow",
      modules: {
        toolbar: {
          container: "#g-toolbar",
          handlers: {
            image: async function () {
              const input = document.createElement("input");
              input.type = "file";
              input.accept = "image/*";
              input.click();
              input.onchange = async () => {
                const file = input.files && input.files[0];
                if (!file) return;
                try {
                  status.textContent = "图片上传中...";
                  const url = await uploadTo("/api/uploads/image", file);
                  status.textContent = "";
                  if (!url) return;
                  const range = quill.getSelection(true) || { index: quill.getLength() };
                  quill.insertEmbed(range.index, "image", url, "user");
                  quill.setSelection(range.index + 1);
                } catch (err) {
                  status.textContent = "";
                  alert(err.message || "图片上传失败");
                }
              };
            },
            attachment: async function () {
              const input = document.createElement("input");
              input.type = "file";
              input.accept = "*/*";
              input.click();
              input.onchange = async () => {
                const file = input.files && input.files[0];
                if (!file) return;
                try {
                  status.textContent = "附件上传中...";
                  const url = await uploadTo("/api/uploads/file", file);
                  status.textContent = "";
                  if (!url) return;
                  const range = quill.getSelection(true) || { index: quill.getLength() };
                  quill.insertText(range.index, file.name, "link", url);
                  quill.insertText(range.index + file.name.length, " ");
                  quill.setSelection(range.index + file.name.length + 1);
                } catch (err) {
                  status.textContent = "";
                  alert(err.message || "附件上传失败");
                }
              };
            },
          },
        },
      },
    });

    // 加载已有内容
    const existingContent = contentField.value || "";
    if (existingContent) {
      quill.root.innerHTML = existingContent;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const token = getToken();
      if (!token) return (window.location.href = "/login");

      const title = document.getElementById("g-title").value.trim();
      const category = document.getElementById("g-category").value.trim();
      const tagsRaw = document.getElementById("g-tags").value.trim();
      const featuredEl = document.getElementById("g-featured");
      const is_featured = featuredEl ? !!featuredEl.checked : false;

      const html = quill.root.innerHTML || "";
      contentField.value = html;
      const content = contentField.value;

      const tags = tagsRaw ? tagsRaw.split(/[,，]/).map(s => s.trim()).filter(Boolean) : [];

      status.textContent = "保存中...";

      const res = await fetch(`/api/articles/${articleId}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token,
        },
        body: JSON.stringify({
          title,
          content,
          category: category || null,
          is_featured,
          tags,
        }),
      });

      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        status.textContent = "";
        return alert(data.detail || "保存失败");
      }

      status.textContent = "保存成功，跳转中...";
      window.location.href = `/guides/${articleId}`;
    });
  });
</script>
{% endblock %}
